<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101514" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="This page could not be found. Return to Type.Shift to practice typing and test your speed and accuracy."
    />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
      sizes="180x180"
    />
    <title>Page not found · Type.Shift</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        background: #101514;
      }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: clamp(24px, 7vw, 80px);
        display: grid;
        place-items: center;
        color: #e6ede9;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(100%, 40rem);
      }
      .brand {
        margin: 0 0 clamp(48px, 9vw, 88px);
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: clamp(1.35rem, 5vw, 1.75rem);
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .brand-type {
        color: #39ff14;
      }
      .brand-shift {
        color: #ff3b3b;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        line-height: 1.2;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      .explanation {
        max-width: 35ch;
        margin: 0 0 32px;
        color: #a5b3aa;
        font-size: 1.0625rem;
      }
      .home {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border: 1px solid #39ff14;
        border-radius: 6px;
        color: #101514;
        background: #39ff14;
        font-weight: 650;
        text-decoration: none;
        text-underline-offset: 4px;
      }
      .home:hover {
        text-decoration: underline;
      }
      .home:active {
        background: #e6ede9;
        border-color: #e6ede9;
      }
      .home:focus-visible {
        outline: 2px solid #e6ede9;
        outline-offset: 6px;
      }
      ::selection {
        color: #101514;
        background: #39ff14;
      }
      @media (forced-colors: active) {
        .home {
          border-color: ButtonText;
        }
        .home:focus-visible {
          outline-color: Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" role="img" aria-label="Type.Shift">
        <span aria-hidden="true"
          >[<span class="brand-type">Type.</span
          ><span class="brand-shift">Shift</span>]</span
        >
      </div>
      <h1>404. Page not found.</h1>
      <p class="explanation">
        This page may have moved, or the address may be incorrect.
      </p>
      <a class="home" href="/">Back to home</a>
    </main>
  </body>
</html>
