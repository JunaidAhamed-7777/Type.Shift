<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101514" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('typeshift-theme') === 'light' ? 'light' : 'dark'; }
      catch (error) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <meta
